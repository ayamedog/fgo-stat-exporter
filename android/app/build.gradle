plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def prepared = providers.gradleProperty('preparedDir').get()
def releaseKey = System.getenv('FGO_ANDROID_KEYSTORE')
// 用户仅对本次正式 APK 授权运行必需的项目页面源码；其余变体仍一律拒绝。
// 仅允许一个明确的预审候选任务；它收集真实 AGP 输入，不执行 package/assemble/sign。
gradle.taskGraph.whenReady {
    def requested = gradle.startParameter.taskNames
    def proposalOnly = requested.size() == 1 && requested[0] == ':app:proposeReleasePackageInputs'
    if (proposalOnly) {
        def forbidden = gradle.taskGraph.allTasks.findAll { task ->
            task.path == ':app:packageRelease' ||
                task.path == ':app:assembleRelease' ||
                task.path == ':app:bundleRelease' ||
                task.path == ':app:packageDebug' ||
                task.path == ':app:assembleDebug' ||
                task.path == ':app:bundleDebug' ||
                task.name.toLowerCase(Locale.ROOT).startsWith('sign')
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException('PREAUDIT_PACKAGE_TASK_FORBIDDEN')
        }
        return
    }
    // 第三方 Python、DEX 和 ELF 的去调试与打包前审阅还未接入，禁止任何 APK 构建。
    def runtimeAuditIntegrated = false
    if (!runtimeAuditIntegrated) {
        throw new GradleException('RUNTIME_PREAUDIT_REQUIRED: 第三方运行载荷尚未完成预审')
    }
    if (requested.size() != 1 || !(requested[0] in ['assembleRelease', ':app:assembleRelease']) ||
            providers.gradleProperty('approvedFrontendAndroidRelease').orNull != '2026-11-10') {
        throw new GradleException('SOURCE_RELEASE_BLOCKED: 仅允许本次授权的正式 APK')
    }
    def manifest = providers.gradleProperty('releaseManifest').orNull
    def sha = providers.gradleProperty('releaseManifestSha256').orNull
    def resourceManifest = providers.gradleProperty('releaseResourceManifest').orNull
    def resourceSha = providers.gradleProperty('releaseResourceManifestSha256').orNull
    def python = providers.gradleProperty('buildPython').orNull
    if (!manifest || !sha || !(sha ==~ /[0-9a-f]{64}/) || !resourceManifest ||
            !resourceSha || !(resourceSha ==~ /[0-9a-f]{64}/) || !python || !releaseKey ||
            !System.getenv('FGO_ANDROID_STORE_PASSWORD') || !System.getenv('FGO_ANDROID_KEY_ALIAS') ||
            !System.getenv('FGO_ANDROID_KEY_PASSWORD')) {
        throw new GradleException('SOURCE_RELEASE_BLOCKED: 缺少冻结清单或正式签名')
    }
    def validation = project.exec { spec ->
        spec.commandLine python, rootProject.file('../tools/prepare_android.py').path,
            '--authorized-frontend-for-this-release', '--output', prepared,
            '--verify-manifest', manifest, '--verify-manifest-sha256', sha,
            '--resource-review', resourceManifest, '--resource-review-sha256', resourceSha
        spec.ignoreExitValue = true
    }
    if (validation.exitValue != 0) {
        throw new GradleException('SOURCE_RELEASE_BLOCKED: 暂存审核失败')
    }
}
android {
    namespace 'io.github.ayamedog.fgostats'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ayamedog.fgostats'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '0.4.15'
        testInstrumentationRunner 'io.github.ayamedog.fgostats.BackendProbe'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets.main.assets.srcDirs = [prepared + '/assets']
    signingConfigs {
        if (releaseKey != null) {
            production {
                storeFile file(releaseKey)
                storePassword System.getenv('FGO_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('FGO_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('FGO_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseKey != null) signingConfig signingConfigs.production
        }
    }
    packaging { jniLibs { useLegacyPackaging false } }
    // APK 通过独立清单审查依赖；不写入随机化的 SDK 依赖元数据签名块。
    dependenciesInfo { includeInApk false; includeInBundle false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
chaquopy {
    sourceSets.main.srcDirs = [prepared + '/python']
    defaultConfig {
        version '3.13'
        buildPython providers.gradleProperty('buildPython').get()
        pip {
            options '--find-links', providers.gradleProperty('wheelDir').get()
            install '-r', rootProject.file('requirements.txt').path
        }
        pyc { src = true; pip = true; stdlib = true }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// 在生成依赖归档前排除测试、类型声明和扩展源码。
afterEvaluate {
    ['Debug', 'Release'].each { variant ->
        tasks.named("generate${variant}PythonRequirementsAssets").configure {
            inputs.file(rootProject.file('../tools/clean_android_runtime.py'))
            doFirst {
                project.exec { spec ->
                    spec.commandLine providers.gradleProperty('buildPython').get(),
                        rootProject.file('../tools/clean_android_runtime.py').path,
                        layout.buildDirectory.dir("python/pip/${variant.toLowerCase()}").get().asFile.path
                }
            }
        }
    }
}

// Candidate hook is active only for the isolated preaudit proposal task; release remains blocked above.
apply from: rootProject.file('../tools/android_preaudit_candidate/package-input-hook.gradle')
