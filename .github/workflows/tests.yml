name: Tests

on:
  push:
    branches: [php-raw-export]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --extra desktop --group build --group dev
      - name: Validate local build script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [void][scriptblock]::Create((Get-Content tools/build_local.ps1 -Raw))
      - name: Lint
        run: uv run ruff check src tests tools run_desktop.py
      - name: Test
        run: uv run pytest -q
